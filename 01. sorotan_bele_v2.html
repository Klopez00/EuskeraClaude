<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Euskera Sorotan Bele-rekin</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --navy: #4b4b4b; --sea: #58cc02; --sea-light: #e5f8cc; --sea-dark: #46a302;
    --sand: #ffffff; --storm: #afafaf; --coral: #ff4b4b; --coral-light: #ffe0e0;
    --dark: #3c3c3c; --mid: #777777; --light-border: #e5e5e5;
  }
  body { font-family: -apple-system, 'Helvetica Neue', system-ui, sans-serif; background: #f7f7f7; color: var(--dark); line-height: 1.6; min-height: 100vh; }
  h1, h2, h3 { font-family: Georgia, 'Times New Roman', serif; font-weight: 400; }
  .container { max-width: 720px; margin: 0 auto; padding: 24px 20px; }

  .landing { text-align: center; padding: 60px 20px 40px; }
  .landing h1 { font-size: 2.8rem; color: var(--dark); line-height: 1.1; margin-bottom: 8px; }
  .landing .sub { font-size: 1.05rem; color: var(--storm); margin-bottom: 36px; }
  .landing .bio { max-width: 540px; margin: 0 auto 40px; font-size: 0.92rem; color: var(--mid); line-height: 1.7; text-align: left; }
  .song-cards { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
  .song-card {
    background: white; border: 1px solid var(--light-border); border-radius: 10px;
    padding: 28px 24px; width: 260px; cursor: pointer; transition: all 0.2s; text-align: left;
    box-shadow: 0 2px 0 var(--light-border);
  }
  .song-card:hover { border-color: var(--sea); box-shadow: 0 2px 0 var(--sea); transform: translateY(-1px); }
  .song-card h3 { font-size: 1.4rem; color: var(--dark); margin-bottom: 6px; }
  .song-card p { font-size: 0.85rem; color: var(--storm); line-height: 1.5; }

  .top-bar { display: flex; align-items: center; gap: 12px; padding: 16px 0; border-bottom: 1px solid var(--light-border); margin-bottom: 24px; }
  .back-btn { background: none; border: none; cursor: pointer; font-size: 1.4rem; color: var(--storm); padding: 4px 8px; border-radius: 6px; }
  .back-btn:hover { background: rgba(0,0,0,0.05); }
  .top-bar h2 { font-size: 1.5rem; color: var(--dark); }
  .tabs { display: flex; gap: 4px; background: white; border-radius: 10px; padding: 4px; border: 1px solid var(--light-border); margin-bottom: 28px; }
  .tab {
    flex: 1; padding: 10px 6px; border: none; background: none; border-radius: 8px;
    font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 0.78rem; font-weight: 500;
    color: var(--storm); cursor: pointer; transition: all 0.15s;
  }
  .tab.active { background: var(--sea); color: white; }

  .intro-section { background: white; border-radius: 10px; padding: 28px 24px; border: 1px solid var(--light-border); margin-bottom: 24px; }
  .intro-section h3 { font-size: 1.3rem; color: var(--dark); margin-bottom: 12px; }
  .intro-section p { font-size: 0.92rem; color: var(--mid); line-height: 1.7; }

  .vocab-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
  .vocab-card { background: white; border: 1px solid var(--light-border); border-radius: 8px; padding: 16px 18px; cursor: pointer; transition: all 0.15s; min-height: 72px; }
  .vocab-card:hover { border-color: var(--sea); }
  .vocab-card .eu { font-family: Georgia, 'Times New Roman', serif; font-size: 1.2rem; color: var(--dark); }
  .vocab-card .flip-hint { font-size: 0.72rem; color: var(--storm); margin-top: 6px; opacity: 0.6; }
  .vocab-card .es { font-size: 0.85rem; color: var(--mid); margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--light-border); }
  .vocab-card .note { font-size: 0.78rem; color: var(--sea-dark); margin-top: 4px; font-style: italic; }

  .phrase-block { background: white; border: 1px solid var(--light-border); border-radius: 10px; padding: 20px 24px; margin-bottom: 14px; cursor: pointer; transition: border-color 0.15s; }
  .phrase-block:hover { border-color: var(--sea); }
  .phrase-eu { font-family: Georgia, 'Times New Roman', serif; font-size: 1.15rem; color: var(--dark); line-height: 1.4; }
  .flip-hint { font-size: 0.72rem; color: var(--storm); margin-top: 8px; opacity: 0.6; }
  .phrase-es { font-size: 0.88rem; color: var(--mid); margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--light-border); }
  .phrase-note { font-size: 0.8rem; color: var(--sea-dark); margin-top: 8px; font-style: italic; line-height: 1.5; }
  .grammar-toggle { display: inline-block; margin-top: 10px; font-size: 0.78rem; font-weight: 500; color: var(--sea-dark); cursor: pointer; border: none; background: none; font-family: -apple-system, 'Helvetica Neue', sans-serif; padding: 4px 0; }
  .grammar-toggle:hover { text-decoration: underline; }
  .grammar-box { margin-top: 10px; padding: 14px 16px; background: var(--sea-light); border-radius: 8px; font-size: 0.82rem; line-height: 1.8; color: var(--dark); }
  .grammar-box .conj { color: var(--sea-dark); font-weight: 600; }
  .grammar-box .label { color: var(--storm); font-size: 0.76rem; }
  .reveal-all-btn { display: inline-block; margin-bottom: 16px; padding: 8px 16px; background: none; border: 1.5px solid var(--light-border); border-radius: 8px; font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 0.8rem; font-weight: 500; color: var(--storm); cursor: pointer; transition: all 0.15s; }
  .reveal-all-btn:hover { border-color: var(--sea); color: var(--sea-dark); }

  /* PRAKTIKA */
  .praktika-block { background: white; border: 1px solid var(--light-border); border-radius: 10px; padding: 24px; margin-bottom: 16px; }
  .praktika-original { font-family: Georgia, 'Times New Roman', serif; font-size: 1.1rem; color: var(--dark); margin-bottom: 4px; }
  .praktika-trans { font-size: 0.82rem; color: var(--storm); margin-bottom: 14px; }
  .praktika-challenge { font-size: 0.88rem; font-weight: 500; color: var(--sea-dark); margin-bottom: 12px; }
  .praktika-input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--light-border); border-radius: 8px; font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 0.92rem; color: var(--dark); outline: none; transition: border-color 0.15s; }
  .praktika-input:focus { border-color: var(--sea); }
  .praktika-show { margin-top: 10px; padding: 8px 16px; background: none; border: 1.5px solid var(--light-border); border-radius: 8px; font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 0.8rem; font-weight: 500; color: var(--storm); cursor: pointer; }
  .praktika-show:hover { border-color: var(--sea); color: var(--sea-dark); }
  .praktika-answer { margin-top: 12px; padding: 14px 16px; background: var(--sea-light); border-radius: 8px; }
  .praktika-answer .ans { font-family: Georgia, 'Times New Roman', serif; font-size: 1.1rem; color: var(--sea-dark); }
  .praktika-answer .exp { font-size: 0.8rem; color: var(--mid); margin-top: 4px; }

  /* QUIZ */
  .quiz-header { text-align: center; margin-bottom: 28px; }
  .quiz-header h3 { font-size: 1.4rem; color: var(--dark); margin-bottom: 6px; }
  .quiz-header p { font-size: 0.88rem; color: var(--storm); }
  .quiz-progress { height: 4px; background: var(--light-border); border-radius: 2px; margin-bottom: 24px; overflow: hidden; }
  .quiz-progress-bar { height: 100%; background: var(--sea); border-radius: 2px; transition: width 0.3s ease; }
  .quiz-question { background: white; border: 1px solid var(--light-border); border-radius: 10px; padding: 28px 24px; text-align: center; }
  .quiz-prompt-label { font-size: 0.78rem; color: var(--storm); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.04em; }
  .quiz-prompt { font-family: Georgia, 'Times New Roman', serif; font-size: 1.4rem; color: var(--dark); margin-bottom: 24px; line-height: 1.3; }
  .quiz-mode-btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
  .quiz-mode-btn { padding: 14px 24px; border-radius: 8px; font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 0.88rem; font-weight: 500; cursor: pointer; transition: all 0.15s; flex: 1; max-width: 220px; min-width: 140px; }
  .quiz-mode-btn.test { background: var(--sea); color: white; border: 1.5px solid var(--sea); box-shadow: 0 3px 0 var(--sea-dark); }
  .quiz-mode-btn.test:hover { background: var(--sea-dark); }
  .quiz-mode-btn.test:active { box-shadow: none; transform: translateY(2px); }
  .quiz-mode-btn.reveal { background: white; color: var(--dark); border: 1.5px solid var(--light-border); box-shadow: 0 3px 0 var(--light-border); }
  .quiz-mode-btn.reveal:hover { border-color: var(--sea); }
  .quiz-mode-btn.reveal:active { box-shadow: none; transform: translateY(2px); }
  .quiz-options { display: flex; flex-direction: column; gap: 10px; }
  .quiz-opt { padding: 14px 18px; border: 1.5px solid var(--light-border); border-radius: 8px; background: white; cursor: pointer; font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 0.9rem; color: var(--dark); text-align: left; transition: all 0.15s; }
  .quiz-opt:hover:not(.locked) { border-color: var(--sea); background: var(--sea-light); }
  .quiz-opt.correct { border-color: var(--sea); background: var(--sea-light); color: var(--sea-dark); font-weight: 600; }
  .quiz-opt.wrong { border-color: var(--coral); background: var(--coral-light); color: var(--coral); }
  .quiz-opt.locked { cursor: default; }
  .quiz-opt.dim { opacity: 0.45; }
  .quiz-reveal-answer { padding: 18px 24px; background: var(--sea-light); border: 1.5px solid var(--sea); border-radius: 8px; text-align: center; }
  .quiz-reveal-answer .ans-label { font-size: 0.76rem; color: var(--storm); margin-bottom: 6px; }
  .quiz-reveal-answer .ans-text { font-family: Georgia, 'Times New Roman', serif; font-size: 1.3rem; color: var(--sea-dark); }
  .quiz-next { display: block; margin: 20px auto 0; padding: 12px 32px; background: var(--sea); color: white; border: none; border-radius: 8px; font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; box-shadow: 0 3px 0 var(--sea-dark); }
  .quiz-next:hover { background: var(--sea-dark); }
  .quiz-next:active { box-shadow: none; transform: translateY(2px); }
  .quiz-result { text-align: center; padding: 40px 20px; }
  .quiz-result .score { font-family: Georgia, 'Times New Roman', serif; font-size: 3rem; color: var(--dark); }
  .quiz-result .msg { font-size: 1rem; color: var(--storm); margin: 8px 0 28px; }
  .restart-btn { padding: 12px 28px; background: var(--sea); color: white; border: none; border-radius: 8px; font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 0.9rem; font-weight: 500; cursor: pointer; margin: 0 6px; box-shadow: 0 3px 0 var(--sea-dark); }
  .restart-btn:hover { background: var(--sea-dark); }
  .restart-btn:active { box-shadow: none; transform: translateY(2px); }
  .restart-btn.outline { background: white; border: 1.5px solid var(--light-border); color: var(--storm); box-shadow: 0 3px 0 var(--light-border); }
  .combined-quiz-btn { padding: 14px 32px; background: var(--sea); color: white; border: none; border-radius: 10px; font-family: -apple-system, 'Helvetica Neue', sans-serif; font-size: 0.95rem; font-weight: 600; cursor: pointer; box-shadow: 0 3px 0 var(--sea-dark); }
  .combined-quiz-btn:hover { background: var(--sea-dark); }
  .combined-quiz-btn:active { box-shadow: none; transform: translateY(2px); }
  .section-label { font-size: 0.78rem; font-weight: 600; color: var(--storm); letter-spacing: 0.03em; margin-bottom: 14px; }

  @media (max-width: 500px) {
    .landing h1 { font-size: 2rem; }
    .song-cards { flex-direction: column; align-items: center; }
    .song-card { width: 100%; }
    .vocab-grid { grid-template-columns: 1fr; }
    .tabs { flex-wrap: wrap; }
  }
</style>
</head>
<body>
<div class="container" id="app"></div>
<script>
const SONGS = {
  atalaia: {
    title: "Atalaia",
    introEs: "Una canción sobre la caza de ballenas en la costa vasca. Una mañana, el vigía avista una ballena desde la atalaya y todo el pueblo sale al mar a cazarla: el más fuerte, los más jóvenes, todos. Lanzan el arpón sin clemencia, y cuando la ballena muere celebran en el muelle. Pero entonces aparece una cría de ballena, y el remordimiento les golpea.",
    vocab: [
      { eu: "esnatu", es: "despertar(se)" },
      { eu: "atalaia", es: "atalaya, torre de vigía" },
      { eu: "itsasoa", es: "el mar", note: "itsasoruntz = hacia el mar" },
      { eu: "balea", es: "ballena" },
      { eu: "trainera", es: "trainera (canoa de remo)" },
      { eu: "olatua", es: "ola" },
      { eu: "arpegia", es: "el rostro" },
      { eu: "euria", es: "la lluvia", note: "euriz = con lluvia (instrumental)" },
      { eu: "herria", es: "pueblo" },
      { eu: "gizona", es: "hombre" },
      { eu: "mutila", es: "muchacho, chico" },
      { eu: "arpoia", es: "arpón" },
      { eu: "soka", es: "cuerda, soga" },
      { eu: "bihotza", es: "corazón" },
      { eu: "kaia", es: "muelle" },
      { eu: "saria", es: "premio, recompensa" },
      { eu: "kumea", es: "cría" },
      { eu: "algaraka", es: "jaleo, alboroto" },
      { eu: "gupida", es: "clemencia, compasión" },
    ],
    phrases: [
      { eu: "Goiza baten esnatu nintzen", es: "Una mañana me desperté",
        grammar: { label: "Conjugar: esnatu (nor, iragana)",
          rows: [["ni","esnatu nintzen","me desperté"],["zu","esnatu zinen","te despertaste"],["hura","esnatu zen","se despertó"],["gu","esnatu ginen","nos despertamos"],["haiek","esnatu ziren","se despertaron"]] }},
      { eu: "Atalaiaren gainean", es: "En lo alto de la atalaya",
        grammar: { label: "-aren gainean = encima de",
          rows: [["etxea","etxearen gainean","encima de la casa"],["mendia","mendiaren gainean","encima del monte"],["mahaia","mahaiaren gainean","encima de la mesa"]] }},
      { eu: "Itsasoruntz begiratu nun", es: "Miré hacia el mar",
        grammar: { label: "Conjugar: begiratu (nork, iragana)",
          rows: [["nik","begiratu nuen","yo miré"],["zuk","begiratu zenuen","tú miraste"],["hark","begiratu zuen","él/ella miró"],["guk","begiratu genuen","nosotros miramos"]] }},
      { eu: "Hantxe zegoen balea", es: "Allí estaba la ballena" },
      { eu: "Ohiu garraxix hasi nintzen", es: "Empecé a gritar a voces",
        note: "Redundancia expresiva: ohiu = grito, garraxika = a gritos. Sería correcto decir solo \"ohiuka hasi nintzen\" o \"garraxika hasi nintzen\". Juntos dan más fuerza." },
      { eu: "Sorbaldan hartuz trainera", es: "Cogiendo la trainera al hombro" },
      { eu: "Balearuntz bota genuen", es: "Nos lanzamos hacia la ballena",
        grammar: { label: "-runtz = hacia (dirección)",
          rows: [["itsasoa","itsasoruntz","hacia el mar"],["etxea","etxeruntz","hacia casa"],["mendia","mendiruntz","hacia el monte"]] }},
      { eu: "Olatu ginen gainean", es: "Sobre las olas",
        note: "Forma inusual. Lo esperable sería \"olatu gainean ginen\" (estuvimos sobre las olas)." },
      { eu: "Atalaiaren gainean\nArpegia euriz bustia", es: "En lo alto de la atalaya\nEl rostro mojado por la lluvia" },
      { eu: "Goiz ilun hartan irten ginen\nherri hartan ziren", es: "Aquella mañana oscura salimos,\nlos que había en aquel pueblo" },
      { eu: "Gizonarik indartsuena\neta mutilik gazteenak", es: "El hombre más fuerte\ny los muchachos más jóvenes",
        grammar: { label: "Superlativo: -rik + -ena / -enak",
          rows: [["indartsua (fuerte)","indartsuena","el más fuerte"],["gaztea (joven)","gazteenak","los más jóvenes"],["polita (bonito/a)","politena","el/la más bonito/a"],["handia (grande)","handiena","el más grande"]] }},
      { eu: "Amorru biziz bota genun\nsokaz loturik arpoia", es: "Con rabia viva lanzamos\nel arpón atado con soga" },
      { eu: "Guk gupidarik ezgenun izan", es: "No tuvimos clemencia" },
      { eu: "Haren bizitza akatzean", es: "Al acabar su vida" },
      { eu: "Kaian algaraka hasi ginan\ngeure saria ikustean", es: "En el muelle empezamos a montar jaleo\nal ver nuestra recompensa" },
      { eu: "Bale kume bat agertu zan", es: "Apareció una cría de ballena" },
      { eu: "Ta erre zizkigun bihotzak", es: "Y nos quemó los corazones" },
    ],
    praktika: [
      { eu: "Esnatu nintzen", es: "(me desperté)", challenge: "¿Cómo dirías \"se despertó\" (hura)?", answer: "Esnatu zen", explanation: "nor iragana: nintzen (ni) → zen (hura)" },
      { eu: "Itsasoruntz begiratu nun", es: "(miré hacia el mar)", challenge: "¿Y si miramos nosotros (gu)?", answer: "Itsasoruntz begiratu genuen", explanation: "nork iragana: nuen (nik) → genuen (guk)" },
      { eu: "Hasi nintzen", es: "(empecé)", challenge: "¿En presente? (empiezo)", answer: "Hasten naiz", explanation: "Presente habitual: -ten + nor oraina. nintzen → naiz" },
      { eu: "Bale kume bat agertu zan", es: "(apareció una cría)", challenge: "¿Y si aparecieron varias crías?", answer: "Bale kume batzuk agertu ziren", explanation: "bat → batzuk, zen → ziren (plural)" },
      { eu: "Kaian algaraka hasi ginan", es: "(empezamos a montar jaleo en el muelle)", challenge: "¿Y si fuiste tú solo/a?", answer: "Kaian algaraka hasi nintzen", explanation: "ginan (gu) → nintzen (ni)" },
    ]
  },
  marinelaren: {
    title: "Mariñelaren zai",
    introEs: "Una historia de amor triste y de clases sociales. La hija del herrero es la más encantadora del pueblo y dos hombres la pretenden: un marinero y el señorito del pueblo. Ella ama al marinero, pero su padre la obliga a casarse con el señorito. El marinero se va a Irlanda. La boda se celebra y todos bailan como si las diferencias de clase no existieran. Pero aún hoy, la hija sigue en la ventana, esperando al marinero. Su esperanza está en el mar.",
    vocab: [
      { eu: "arotza", es: "herrero" },
      { eu: "alaba", es: "hija" },
      { eu: "marinela", es: "marinero" },
      { eu: "aita", es: "padre" },
      { eu: "maite", es: "querido/a, amar", note: "maite dut = le/lo amo" },
      { eu: "jauntxoa", es: "señorito, terrateniente" },
      { eu: "bihotza", es: "corazón" },
      { eu: "emaztea", es: "esposa" },
      { eu: "ezkontza", es: "boda, matrimonio" },
      { eu: "eskua", es: "mano" },
      { eu: "dantza", es: "baile" },
      { eu: "leihoa", es: "ventana" },
      { eu: "itxaropena", es: "esperanza" },
      { eu: "maitasuna", es: "el amor" },
      { eu: "egarria", es: "sed, ansia" },
      { eu: "xarmangarria", es: "encantador/a" },
    ],
    phrases: [
      { eu: "Arotzak zuen alaba bat:", es: "El herrero tenía una hija:" },
      { eu: "zan herriko xarmangarriena.", es: "era la más encantadora del pueblo." },
      { eu: "Bi gizonek nahi zuten jabe izan\nharen bihotzaz... nola esan?", es: "Dos hombres querían ser dueños\nde su corazón... ¿cómo decirlo?" },
      { eu: "Zer dun, zer dun, ene alaba?", es: "¿Qué tienes, qué tienes, hija mía?",
        grammar: { label: "hika (tuteo): dun = duzu en forma familiar",
          rows: [["zuka (neutro)","zer duzu?","¿qué tienes?"],["hika (masc.)","zer duk?","¿qué tienes? (a chico)"],["hika (fem.)","zer dun?","¿qué tienes? (a chica)"]] }},
      { eu: "Marinela maite dut, aita.", es: "Amo al marinero, padre.",
        grammar: { label: "Conjugar: maite (nork-nor, oraina)",
          rows: [["nik","maite dut","yo amo"],["zuk","maite duzu","tú amas"],["hark","maite du","él/ella ama"],["guk","maite dugu","nosotros amamos"],["haiek","maite dute","ellos aman"]] }},
      { eu: "Ez al dun ulertzen? Ezinezkoa da!", es: "¿No lo entiendes? ¡Es imposible!",
        grammar: { label: "Negación: ez + aditz laguntzailea",
          rows: [["bai","ulertzen dut","lo entiendo"],["ez","ez dut ulertzen","no lo entiendo"],["galdera","ulertzen al duzu?","¿lo entiendes?"],["ez + galdera","ez al duzu ulertzen?","¿no lo entiendes?"]] }},
      { eu: "Jauntxoa da hiretzat maitia.", es: "El señorito es el amor para ti.",
        grammar: { label: "-entzat = para (destinatario)",
          rows: [["hi (hika)","hiretzat","para ti"],["zu","zuretzat","para ti/usted"],["ni","niretzat","para mí"],["gu","guretzat","para nosotros"]] }},
      { eu: "Orduan egarriak denak ziren bat\nmaitasun ukatuarentzat.", es: "Entonces las ansias eran una sola\npara el amor negado." },
      { eu: "Jauntxoa dator hire esku bila.", es: "El señorito viene a buscar tu mano.",
        grammar: { label: "-en bila = en busca de",
          rows: [["eskua","esku bila","en busca de la mano"],["lana","lan bila","en busca de trabajo"],["laguna","lagun bila","en busca del amigo"]] }},
      { eu: "Marinela Irlandara doa.", es: "El marinero se va a Irlanda." },
      { eu: "Hala izan tzan, ezkontz behartua.", es: "Así fue, boda obligada." },
      { eu: "Aberatsik ez ziren han.", es: "Ricos no había allí." },
      { eu: "Ta guztiak dantzan, guztiak alai.\nMail ezberdinak ahaztuaz.", es: "Y todos bailando, todos alegres.\nOlvidando las diferentes clases." },
      { eu: "Jauntxoaren emaztea zara!", es: "¡Eres la esposa del señorito!",
        grammar: { label: "Conjugar: izan (nor, oraina)",
          rows: [["ni","naiz","soy"],["zu","zara","eres"],["hura","da","es"],["gu","gara","somos"],["zuek","zarete","sois"],["haiek","dira","son"]] }},
      { eu: "Gaur egun oraindik ikus dezakegu\nalaba hura leihoan", es: "Hoy en día aún podemos ver\naquella hija en la ventana" },
      { eu: "marinelaren zai, zai.", es: "esperando al marinero, esperando." },
      { eu: "Itsasoan du itxaropena.", es: "En el mar tiene su esperanza." },
    ],
    praktika: [
      { eu: "Marinela maite dut, aita.", es: "(amo al marinero, padre)", challenge: "¿En pasado? (amaba/amé)", answer: "Marinela maite nuen, aita.", explanation: "nork-nor iragana: dut (nik, oraina) → nuen (nik, iragana)" },
      { eu: "Marinela Irlandara doa.", es: "(el marinero se va a Irlanda)", challenge: "¿Si se van varios (haiek)?", answer: "Marinelak Irlandara doaz.", explanation: "doa (hura) → doaz (haiek). Marinela → marinelak (plural ergatibo)" },
      { eu: "Jauntxoaren emaztea zara!", es: "(¡eres la esposa del señorito!)", challenge: "¿Si hablamos de ella (hura)?", answer: "Jauntxoaren emaztea da!", explanation: "izan oraina: zara (zu) → da (hura)" },
      { eu: "Gaur egun oraindik ikus dezakegu", es: "(hoy en día aún podemos ver)", challenge: "¿Si puedes ver tú solo/a (zuk)?", answer: "Gaur egun oraindik ikus dezakezu", explanation: "ahal nork: dezakegu (guk) → dezakezu (zuk)" },
      { eu: "Arotzak zuen alaba bat.", es: "(el herrero tenía una hija)", challenge: "¿En presente? (tiene)", answer: "Arotzak alaba bat du.", explanation: "nork-nor: zuen (iragana) → du (oraina)" },
    ]
  }
};

// ═══════════════════════════════════════════════
const state = {
  view: 'landing', song: null, tab: 'sarrera',
  openGrammar: new Set(), revealedPhrases: new Set(), revealedVocab: new Set(),
  revealedPraktika: new Set(),
  quizQuestions: [], quizIndex: 0, quizScore: 0, quizTotal: 0,
  quizAnswered: false, quizDone: false, quizMode: null, quizSelected: null,
};

function render() {
  const app = document.getElementById('app');
  if (state.view === 'landing') app.innerHTML = renderLanding();
  else if (state.view === 'combined') app.innerHTML = renderCombinedQuiz();
  else app.innerHTML = renderSong();
  bindEvents();
}

function renderLanding() {
  return `
    <div class="landing">
      <h1>Euskera kantekin</h1>
      <p class="sub">Aprende euskera con canciones de Sorotan Bele</p>
      <div class="bio">
        Sorotan Bele fue un grupo de folk-pop de Hondarribia formado en 1991 por siete amigos.
        Sacaron dos discos en los 90 y se convirtieron en uno de los grupos más reconocidos de la música vasca.
        Después, desaparecieron del mapa. Sus canciones siguen siendo himnos generacionales.
        Elige una canción para empezar.
      </div>
      <div class="song-cards">
        <div class="song-card" data-song="atalaia"><h3>Atalaia</h3><p>La caza de la ballena. Mar, pueblo y remordimiento.</p></div>
        <div class="song-card" data-song="marinelaren"><h3>Mari\u00f1elaren zai</h3><p>Amor prohibido. La hija del herrero, el marinero y el señorito.</p></div>
      </div>
      <div style="text-align:center; margin-top:28px;">
        <button class="combined-quiz-btn" data-action="combined-quiz">Azterketa orokorra \u2014 bi kantak</button>
      </div>
    </div>`;
}

function renderSong() {
  const song = SONGS[state.song];
  const tabs = [
    { id: 'sarrera', label: 'Sarrera' }, { id: 'hitzak', label: 'Hitz gakoak' },
    { id: 'esaldiak', label: 'Esaldiak' }, { id: 'praktika', label: 'Praktika' },
    { id: 'azterketa', label: 'Azterketa' },
  ];
  let content = '';
  if (state.tab === 'sarrera') content = renderIntro(song);
  else if (state.tab === 'hitzak') content = renderVocab(song);
  else if (state.tab === 'esaldiak') content = renderPhrases(song);
  else if (state.tab === 'praktika') content = renderPraktika(song);
  else if (state.tab === 'azterketa') content = renderQuiz(song);
  return `
    <div class="top-bar"><button class="back-btn" data-action="back">\u2190</button><h2>${song.title}</h2></div>
    <div class="tabs">${tabs.map(t => `<button class="tab ${state.tab === t.id ? 'active' : ''}" data-tab="${t.id}">${t.label}</button>`).join('')}</div>
    ${content}`;
}

function renderIntro(song) {
  return `<div class="intro-section"><h3>De qué va esta canción</h3><p>${song.introEs}</p></div>`;
}

function renderVocab(song) {
  const allR = song.vocab.every((_, i) => state.revealedVocab.has(state.song + '-' + i));
  return `
    <p class="section-label">Hitz gakoak \u2014 Toca para ver la traducción</p>
    <button class="reveal-all-btn" data-action="reveal-all-vocab">${allR ? 'Ocultar todas' : 'Mostrar todas'}</button>
    <div class="vocab-grid">${song.vocab.map((v, i) => {
      const r = state.revealedVocab.has(state.song + '-' + i);
      return `<div class="vocab-card" data-vocab="${i}"><div class="eu">${v.eu}</div>${r ? `<div class="es">${v.es}</div>${v.note ? `<div class="note">${v.note}</div>` : ''}` : `<div class="flip-hint">\u2193</div>`}</div>`;
    }).join('')}</div>`;
}

function renderPhrases(song) {
  const allR = song.phrases.every((_, i) => state.revealedPhrases.has(state.song + '-' + i));
  return `
    <p class="section-label">Esaldiak \u2014 Toca para ver la traducción</p>
    <button class="reveal-all-btn" data-action="reveal-all-phrases">${allR ? 'Ocultar todas' : 'Mostrar todas'}</button>
    ${song.phrases.map((p, i) => {
      const key = state.song + '-' + i;
      const rev = state.revealedPhrases.has(key);
      const gOpen = state.openGrammar.has(key);
      return `<div class="phrase-block" data-flip="${i}">
        <div class="phrase-eu">${p.eu.replace(/\n/g,'<br>')}</div>
        ${rev ? `<div class="phrase-es">${p.es.replace(/\n/g,'<br>')}</div>
          ${p.note ? `<div class="phrase-note">${p.note}</div>` : ''}
          ${p.grammar ? `<button class="grammar-toggle" data-grammar="${i}">${gOpen?'\u25be':'\u25b8'} ${p.grammar.label}</button>
            ${gOpen ? `<div class="grammar-box">${p.grammar.rows.map(r=>`<span class="label">${r[0]}</span> \u2192 <span class="conj">${r[1]}</span> \u2014 ${r[2]}<br>`).join('')}</div>` : ''}` : ''}
        ` : `<div class="flip-hint">\u2193</div>`}
      </div>`;
    }).join('')}`;
}

function renderPraktika(song) {
  return `
    <p class="section-label">Praktika \u2014 Transforma las frases</p>
    <p style="font-size:0.88rem; color:var(--mid); margin-bottom:20px;">Escribe tu respuesta y después comprueba. No se corrige automáticamente: el objetivo es pensar antes de mirar.</p>
    ${song.praktika.map((p, i) => {
      const key = state.song + '-p-' + i;
      const revealed = state.revealedPraktika.has(key);
      return `<div class="praktika-block">
        <div class="praktika-original">${p.eu}</div>
        <div class="praktika-trans">${p.es}</div>
        <div class="praktika-challenge">${p.challenge}</div>
        <input class="praktika-input" type="text" placeholder="Idatzi hemen..." data-praktika="${i}">
        <button class="praktika-show" data-show-praktika="${i}">${revealed ? 'Ezkutatu' : 'Erantzuna ikusi'}</button>
        ${revealed ? `<div class="praktika-answer"><div class="ans">${p.answer}</div><div class="exp">${p.explanation}</div></div>` : ''}
      </div>`;
    }).join('')}`;
}

// ═══════════════════════════════════════════════
//  QUIZ
// ═══════════════════════════════════════════════
function generateQuiz(song) {
  const qs = [];
  const v1 = [...song.vocab].sort(()=>Math.random()-0.5).slice(0,4);
  v1.forEach(v => { const w = song.vocab.filter(x=>x.eu!==v.eu).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.es); qs.push({prompt:v.eu,promptLabel:'Zer esan nahi du?',answer:v.es,options:shuffle([v.es,...w])}); });
  const v2 = [...song.vocab].sort(()=>Math.random()-0.5).slice(0,4);
  v2.forEach(v => { const w = song.vocab.filter(x=>x.eu!==v.eu).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.eu); qs.push({prompt:v.es,promptLabel:'Nola esaten da euskaraz?',answer:v.eu,options:shuffle([v.eu,...w])}); });
  const sp = song.phrases.filter(p=>p.es.length<55);
  sp.sort(()=>Math.random()-0.5).slice(0,2).forEach(p => { const w = sp.filter(x=>x.es!==p.es).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.es); qs.push({prompt:p.eu.replace(/\n/g,' / '),promptLabel:'Itzuli gaztelaniara',answer:p.es,options:shuffle([p.es,...w])}); });
  const sp2 = song.phrases.filter(p=>p.eu.length<45&&!p.eu.includes('\n'));
  sp2.sort(()=>Math.random()-0.5).slice(0,2).forEach(p => { const w = sp2.filter(x=>x.eu!==p.eu).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.eu); qs.push({prompt:p.es,promptLabel:'Nola esaten da euskaraz?',answer:p.eu,options:shuffle([p.eu,...w])}); });
  return shuffle(qs).slice(0,12);
}

function generateCombinedQuiz() {
  const allV = [...SONGS.atalaia.vocab,...SONGS.marinelaren.vocab];
  const allP = [...SONGS.atalaia.phrases,...SONGS.marinelaren.phrases];
  const qs = [];
  [...allV].sort(()=>Math.random()-0.5).slice(0,5).forEach(v => { const w = allV.filter(x=>x.eu!==v.eu).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.es); qs.push({prompt:v.eu,promptLabel:'Zer esan nahi du?',answer:v.es,options:shuffle([v.es,...w])}); });
  [...allV].sort(()=>Math.random()-0.5).slice(0,5).forEach(v => { const w = allV.filter(x=>x.eu!==v.eu).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.eu); qs.push({prompt:v.es,promptLabel:'Nola esaten da euskaraz?',answer:v.eu,options:shuffle([v.eu,...w])}); });
  const sp = allP.filter(p=>p.es.length<55);
  sp.sort(()=>Math.random()-0.5).slice(0,3).forEach(p => { const w = sp.filter(x=>x.es!==p.es).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.es); qs.push({prompt:p.eu.replace(/\n/g,' / '),promptLabel:'Itzuli gaztelaniara',answer:p.es,options:shuffle([p.es,...w])}); });
  const sp2 = allP.filter(p=>p.eu.length<45&&!p.eu.includes('\n'));
  sp2.sort(()=>Math.random()-0.5).slice(0,3).forEach(p => { const w = sp2.filter(x=>x.eu!==p.eu).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.eu); qs.push({prompt:p.es,promptLabel:'Nola esaten da euskaraz?',answer:p.eu,options:shuffle([p.eu,...w])}); });
  return shuffle(qs).slice(0,16);
}

function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderQuizBody(q) {
  let body = '';
  if (state.quizMode === null) {
    body = `<div class="quiz-mode-btns"><button class="quiz-mode-btn test" data-qmode="test">Aukerak erakutsi</button><button class="quiz-mode-btn reveal" data-qmode="reveal">Erantzuna ikusi</button></div>`;
  } else if (state.quizMode === 'test') {
    body = `<div class="quiz-options">${q.options.map((o,i) => {
      let c='quiz-opt';if(state.quizAnswered){c+=' locked';if(o===q.answer)c+=' correct';else if(o===state.quizSelected&&o!==q.answer)c+=' wrong';else c+=' dim';}
      return `<button class="${c}" data-answer="${i}">${o}</button>`;
    }).join('')}</div>${state.quizAnswered?`<button class="quiz-next" data-action="next-q">Hurrengoa \u2192</button>`:''}`;
  } else {
    body = `<div class="quiz-reveal-answer"><div class="ans-label">Erantzuna</div><div class="ans-text">${q.answer}</div></div><button class="quiz-next" data-action="next-q">Hurrengoa \u2192</button>`;
  }
  return body;
}

function renderQuizResult() {
  const pct = state.quizTotal>0?Math.round((state.quizScore/state.quizTotal)*100):0;
  let msg = state.quizTotal===0?'Hitz guztiak ikusi dituzu. Saiatu testa egiten!':pct>=80?'Bikain! Oso ondo!':pct>=50?'Ondo! Jarraitu praktikatzen.':'Ez kezkatu, saiatu berriro!';
  const skipped = state.quizQuestions.length - state.quizTotal;
  return `<div class="quiz-result">
    <div class="score">${state.quizTotal>0?state.quizScore+' / '+state.quizTotal:'\u2014'}</div>
    <div class="msg">${msg}${skipped>0?'<br><span style="font-size:0.82rem;color:var(--storm);">'+skipped+' galdera erantzuna ikusi zenuen</span>':''}</div>`;
}

function renderQuiz(song) {
  if (state.quizDone) return renderQuizResult() + `<button class="restart-btn" data-action="restart-quiz">Berriro saiatu</button> <button class="restart-btn outline" data-action="back">Atzera</button></div>`;
  if (!state.quizQuestions.length) { state.quizQuestions=generateQuiz(song);state.quizIndex=0;state.quizScore=0;state.quizTotal=0;state.quizAnswered=false;state.quizMode=null; }
  const q=state.quizQuestions[state.quizIndex]; const pr=(state.quizIndex/state.quizQuestions.length)*100;
  return `<div class="quiz-header"><h3>Azterketa</h3><p>${state.quizIndex+1} / ${state.quizQuestions.length}</p></div>
    <div class="quiz-progress"><div class="quiz-progress-bar" style="width:${pr}%"></div></div>
    <div class="quiz-question"><div class="quiz-prompt-label">${q.promptLabel}</div><div class="quiz-prompt">${q.prompt}</div>${renderQuizBody(q)}</div>`;
}

function renderCombinedQuiz() {
  if (state.quizDone) return `<div class="top-bar"><button class="back-btn" data-action="back">\u2190</button><h2>Azterketa orokorra</h2></div>` + renderQuizResult() + `<button class="restart-btn" data-action="restart-combined">Berriro saiatu</button> <button class="restart-btn outline" data-action="back">Atzera</button></div>`;
  if (!state.quizQuestions.length) { state.quizQuestions=generateCombinedQuiz();state.quizIndex=0;state.quizScore=0;state.quizTotal=0;state.quizAnswered=false;state.quizMode=null; }
  const q=state.quizQuestions[state.quizIndex]; const pr=(state.quizIndex/state.quizQuestions.length)*100;
  return `<div class="top-bar"><button class="back-btn" data-action="back">\u2190</button><h2>Azterketa orokorra</h2></div>
    <div class="quiz-header"><p>${state.quizIndex+1} / ${state.quizQuestions.length}</p></div>
    <div class="quiz-progress"><div class="quiz-progress-bar" style="width:${pr}%"></div></div>
    <div class="quiz-question"><div class="quiz-prompt-label">${q.promptLabel}</div><div class="quiz-prompt">${q.prompt}</div>${renderQuizBody(q)}</div>`;
}

// ═══════════════════════════════════════════════
//  EVENTS
// ═══════════════════════════════════════════════
function bindEvents() {
  document.querySelectorAll('.song-card').forEach(el => el.addEventListener('click', () => {
    state.view='song'; state.song=el.dataset.song; state.tab='sarrera';
    state.openGrammar.clear(); state.revealedPhrases.clear(); state.revealedVocab.clear(); state.revealedPraktika.clear();
    resetQuiz(); render();
  }));
  document.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => {
    state.tab=el.dataset.tab; if(el.dataset.tab==='azterketa')resetQuiz(); render();
  }));
  document.querySelectorAll('[data-action="back"]').forEach(el => el.addEventListener('click', () => { state.view='landing'; state.song=null; render(); }));

  // Vocab flip
  document.querySelectorAll('.vocab-card[data-vocab]').forEach(el => el.addEventListener('click', () => {
    const k=state.song+'-'+el.dataset.vocab; state.revealedVocab.has(k)?state.revealedVocab.delete(k):state.revealedVocab.add(k); render();
  }));
  document.querySelectorAll('[data-action="reveal-all-vocab"]').forEach(el => el.addEventListener('click', () => {
    const s=SONGS[state.song]; const all=s.vocab.every((_,i)=>state.revealedVocab.has(state.song+'-'+i));
    s.vocab.forEach((_,i)=>{const k=state.song+'-'+i; all?state.revealedVocab.delete(k):state.revealedVocab.add(k);}); render();
  }));

  // Phrase flip
  document.querySelectorAll('.phrase-block[data-flip]').forEach(el => el.addEventListener('click', (e) => {
    if(e.target.closest('.grammar-toggle')||e.target.closest('.grammar-box'))return;
    const k=state.song+'-'+el.dataset.flip; state.revealedPhrases.has(k)?state.revealedPhrases.delete(k):state.revealedPhrases.add(k); render();
  }));
  document.querySelectorAll('[data-action="reveal-all-phrases"]').forEach(el => el.addEventListener('click', () => {
    const s=SONGS[state.song]; const all=s.phrases.every((_,i)=>state.revealedPhrases.has(state.song+'-'+i));
    s.phrases.forEach((_,i)=>{const k=state.song+'-'+i; all?state.revealedPhrases.delete(k):state.revealedPhrases.add(k);}); render();
  }));
  document.querySelectorAll('.grammar-toggle').forEach(el => el.addEventListener('click', (e) => {
    e.stopPropagation(); const k=state.song+'-'+el.dataset.grammar;
    state.openGrammar.has(k)?state.openGrammar.delete(k):state.openGrammar.add(k); render();
  }));

  // Praktika
  document.querySelectorAll('[data-show-praktika]').forEach(el => el.addEventListener('click', () => {
    const k=state.song+'-p-'+el.dataset.showPraktika;
    state.revealedPraktika.has(k)?state.revealedPraktika.delete(k):state.revealedPraktika.add(k);
    // preserve input values
    const inputs = {};
    document.querySelectorAll('.praktika-input').forEach(inp => { inputs[inp.dataset.praktika] = inp.value; });
    render();
    document.querySelectorAll('.praktika-input').forEach(inp => { if(inputs[inp.dataset.praktika]) inp.value = inputs[inp.dataset.praktika]; });
  }));

  // Quiz
  document.querySelectorAll('[data-qmode]').forEach(el => el.addEventListener('click', () => {
    state.quizMode=el.dataset.qmode; if(state.quizMode==='reveal')state.quizAnswered=true; render();
  }));
  document.querySelectorAll('.quiz-opt:not(.locked)').forEach(el => el.addEventListener('click', () => {
    if(state.quizAnswered)return; const q=state.quizQuestions[state.quizIndex];
    const sel=q.options[parseInt(el.dataset.answer)]; state.quizSelected=sel; state.quizAnswered=true; state.quizTotal++;
    if(sel===q.answer)state.quizScore++; render();
  }));
  document.querySelectorAll('[data-action="next-q"]').forEach(el => el.addEventListener('click', () => {
    state.quizIndex++; state.quizAnswered=false; state.quizSelected=null; state.quizMode=null;
    if(state.quizIndex>=state.quizQuestions.length)state.quizDone=true; render();
  }));
  document.querySelectorAll('[data-action="restart-quiz"]').forEach(el => el.addEventListener('click', () => { resetQuiz(); state.quizQuestions=generateQuiz(SONGS[state.song]); render(); }));
  document.querySelectorAll('[data-action="combined-quiz"]').forEach(el => el.addEventListener('click', () => { state.view='combined'; state.song=null; resetQuiz(); render(); }));
  document.querySelectorAll('[data-action="restart-combined"]').forEach(el => el.addEventListener('click', () => { resetQuiz(); state.quizQuestions=generateCombinedQuiz(); render(); }));
}

function resetQuiz() { state.quizQuestions=[];state.quizIndex=0;state.quizScore=0;state.quizTotal=0;state.quizAnswered=false;state.quizSelected=null;state.quizDone=false;state.quizMode=null; }

render();
</script>
</body>
</html>
