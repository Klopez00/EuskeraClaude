<!DOCTYPE html>
<html lang="eu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Euskera Ken Zazpi-rekin</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--sea:#58cc02;--sea-light:#e5f8cc;--sea-dark:#46a302;--storm:#afafaf;--coral:#ff4b4b;--coral-light:#ffe0e0;--dark:#3c3c3c;--mid:#777;--light-border:#e5e5e5;--amber:#f59e0b;--amber-light:#fef3c7;--purple:#8b5cf6;--purple-light:#f0ebff}
  body{font-family:-apple-system,'Helvetica Neue',system-ui,sans-serif;background:#f7f7f7;color:var(--dark);line-height:1.6;min-height:100vh}
  h1,h2,h3{font-family:Georgia,'Times New Roman',serif;font-weight:400}
  .container{max-width:720px;margin:0 auto;padding:24px 20px}
  .landing{text-align:center;padding:60px 20px 40px}
  .landing h1{font-size:2.8rem;color:var(--dark);line-height:1.1;margin-bottom:8px}
  .landing .sub{font-size:1.05rem;color:var(--storm);margin-bottom:36px}
  .landing .bio{max-width:540px;margin:0 auto 40px;font-size:.92rem;color:var(--mid);line-height:1.7;text-align:left}
  .song-cards{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}
  .song-card{background:#fff;border:1px solid var(--light-border);border-radius:10px;padding:28px 24px;width:260px;cursor:pointer;transition:all .2s;text-align:left;box-shadow:0 2px 0 var(--light-border)}
  .song-card:hover{border-color:var(--sea);box-shadow:0 2px 0 var(--sea);transform:translateY(-1px)}
  .song-card h3{font-size:1.4rem;color:var(--dark);margin-bottom:6px}
  .song-card p{font-size:.85rem;color:var(--storm);line-height:1.5}
  .top-bar{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--light-border);margin-bottom:24px}
  .back-btn{background:0 0;border:none;cursor:pointer;font-size:1.4rem;color:var(--storm);padding:4px 8px;border-radius:6px}
  .back-btn:hover{background:rgba(0,0,0,.05)}
  .top-bar h2{font-size:1.5rem;color:var(--dark)}
  .tabs{display:flex;gap:4px;background:#fff;border-radius:10px;padding:4px;border:1px solid var(--light-border);margin-bottom:28px}
  .tab{flex:1;padding:10px 3px;border:none;background:0 0;border-radius:8px;font-family:-apple-system,sans-serif;font-size:.66rem;font-weight:500;color:var(--storm);cursor:pointer;transition:all .15s}
  .tab.active{background:var(--sea);color:#fff}
  .intro-section{background:#fff;border-radius:10px;padding:28px 24px;border:1px solid var(--light-border)}
  .intro-section h3{font-size:1.3rem;color:var(--dark);margin-bottom:12px}
  .intro-section p{font-size:.92rem;color:var(--mid);line-height:1.7}
  .intro-section .rec{margin-top:14px;padding:12px 16px;background:#f0f7ff;border-radius:8px;font-size:.85rem;color:#2563eb}
  .vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .vocab-card{background:#fff;border:1px solid var(--light-border);border-radius:8px;padding:16px 18px;cursor:pointer;transition:all .15s;min-height:72px}
  .vocab-card:hover{border-color:var(--sea)}
  .vocab-card .eu{font-family:Georgia,serif;font-size:1.2rem;color:var(--dark)}
  .vocab-card .flip-hint{font-size:.72rem;color:var(--storm);margin-top:6px;opacity:.6}
  .vocab-card .es{font-size:.85rem;color:var(--mid);margin-top:6px;padding-top:6px;border-top:1px solid var(--light-border)}
  .vocab-card .note{font-size:.78rem;color:var(--sea-dark);margin-top:4px;font-style:italic}
  .level-header{display:flex;align-items:center;gap:10px;margin:24px 0 14px}
  .level-header:first-of-type{margin-top:0}
  .level-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:.78rem;font-weight:700;color:#fff}
  .level-badge.l1{background:var(--sea)}.level-badge.l2{background:var(--amber)}.level-badge.l3{background:var(--coral)}
  .level-text{font-size:.82rem;font-weight:500;color:var(--mid)}
  .known-card{background:#fff;border:1px solid var(--amber);border-left:4px solid var(--amber);border-radius:8px;padding:18px 18px 16px;margin-bottom:16px}
  .known-card .eu{font-family:Georgia,serif;font-size:1.2rem;color:var(--dark)}
  .known-card .es{font-size:.85rem;color:var(--mid);margin-top:2px;margin-bottom:12px}
  .known-ctx{background:#fefcf5;border-radius:6px;padding:10px 14px;margin-bottom:8px}
  .known-ctx-label{font-size:.7rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
  .known-ctx-label.orig{color:var(--storm)}.known-ctx-label.here{color:var(--amber)}
  .known-ctx-phrase{font-family:Georgia,serif;font-size:.95rem;color:var(--dark);line-height:1.4}
  .known-ctx-trans{font-size:.8rem;color:var(--mid);margin-top:2px}
  .known-arrow{text-align:center;color:var(--amber);font-size:1.1rem;margin:4px 0}
  .vocab-card .morph{font-size:.78rem;margin-top:6px;line-height:1.6}
  .vocab-card .morph-root{background:#fef08a;color:#1a1a1a;font-weight:600;padding:1px 5px;border-radius:3px}
  .vocab-morph-btn{display:block;margin-top:8px;padding:6px 12px;background:#fef9e7;border:1.5px solid #f0d060;border-radius:6px;font-family:-apple-system,sans-serif;font-size:.75rem;font-weight:600;color:#92750c;cursor:pointer;text-align:center}
  .vocab-morph-btn:hover{background:#fef08a}
  .vocab-morph-reveal{margin-top:8px;padding:10px 12px;background:#fef9e7;border-radius:6px;border:1px solid #f0d060}
  .vocab-morph-reveal .morph-main{font-family:Georgia,serif;font-size:1rem;color:#1a1a1a}
  .vocab-morph-reveal .morph-root{background:#fef08a;color:#1a1a1a;font-weight:600;padding:1px 5px;border-radius:3px}
  .vocab-morph-reveal .morph-es{font-size:.8rem;color:var(--mid);margin-top:2px}
  .vocab-card .morph-arrow{color:var(--storm);margin:0 3px}
  .ant-card{background:#fff;border:1px solid var(--light-border);border-radius:8px;padding:18px;margin-bottom:14px;cursor:pointer;transition:border-color .15s}
  .ant-card:hover{border-color:var(--purple)}
  .ant-card.revealed{border-color:var(--purple);border-left:4px solid var(--purple)}
  .ant-pair{display:flex;align-items:center;gap:12px;margin-bottom:4px}
  .ant-word{font-family:Georgia,serif;font-size:1.1rem;color:var(--dark)}
  .ant-arrow{color:var(--purple);font-weight:700;font-size:1.2rem}
  .ant-new{font-family:Georgia,serif;font-size:1.1rem;color:var(--purple)}
  .ant-trans{font-size:.82rem;color:var(--mid)}
  .ant-ctx{font-size:.78rem;color:var(--storm);margin-top:6px;font-style:italic}
  .vocab-ant-btn{display:block;margin-top:8px;padding:6px 12px;background:var(--purple-light);border:1.5px solid var(--purple);border-radius:6px;font-family:-apple-system,sans-serif;font-size:.75rem;font-weight:600;color:var(--purple);cursor:pointer;text-align:center}
  .vocab-ant-btn:hover{background:#e4dafc}
  .vocab-ant-reveal{margin-top:8px;padding:10px 12px;background:var(--purple-light);border-radius:6px;border:1px solid var(--purple)}
  .vocab-ant-reveal .ant-word-big{font-family:Georgia,serif;font-size:1.05rem;color:var(--purple);font-weight:400}
  .vocab-ant-reveal .ant-es{font-size:.8rem;color:var(--mid);margin-top:2px}
  .phrase-block{background:#fff;border:1px solid var(--light-border);border-radius:10px;padding:20px 24px;margin-bottom:14px;cursor:pointer;transition:border-color .15s}
  .phrase-block:hover{border-color:var(--sea)}
  .phrase-block.has-known{background:#fffdf5;border-color:#f0e6c8}
  .phrase-block.has-known:hover{border-color:var(--amber)}
  .phrase-block .known-tag{display:inline-block;font-size:.68rem;color:var(--amber);background:var(--amber-light);padding:2px 8px;border-radius:10px;margin-top:8px}
  .phrase-eu{font-family:Georgia,serif;font-size:1.15rem;color:var(--dark);line-height:1.4}
  .flip-hint{font-size:.72rem;color:var(--storm);margin-top:8px;opacity:.6}
  .phrase-es{font-size:.88rem;color:var(--mid);margin-top:10px;padding-top:10px;border-top:1px solid var(--light-border)}
  .phrase-note{font-size:.8rem;color:var(--sea-dark);margin-top:8px;font-style:italic;line-height:1.5}
  .grammar-toggle{display:inline-block;margin-top:10px;font-size:.78rem;font-weight:500;color:var(--sea-dark);cursor:pointer;border:none;background:0 0;font-family:-apple-system,sans-serif;padding:4px 0}
  .grammar-toggle:hover{text-decoration:underline}
  .grammar-box{margin-top:10px;padding:14px 16px;background:var(--sea-light);border-radius:8px;font-size:.82rem;line-height:1.8;color:var(--dark)}
  .grammar-box .conj{color:var(--sea-dark);font-weight:600}
  .grammar-box .label{color:var(--storm);font-size:.76rem}
  .reveal-all-btn{display:inline-block;margin-bottom:16px;padding:8px 16px;background:0 0;border:1.5px solid var(--light-border);border-radius:8px;font-family:-apple-system,sans-serif;font-size:.8rem;font-weight:500;color:var(--storm);cursor:pointer}
  .reveal-all-btn:hover{border-color:var(--sea);color:var(--sea-dark)}
  .praktika-block{background:#fff;border:1px solid var(--light-border);border-radius:10px;padding:24px;margin-bottom:16px}
  .praktika-original{font-family:Georgia,serif;font-size:1.1rem;color:var(--dark);margin-bottom:4px}
  .praktika-trans{font-size:.82rem;color:var(--storm);margin-bottom:14px}
  .praktika-challenge{font-size:.88rem;font-weight:500;color:var(--sea-dark);margin-bottom:12px}
  .praktika-input{width:100%;padding:12px 14px;border:1.5px solid var(--light-border);border-radius:8px;font-family:-apple-system,sans-serif;font-size:.92rem;color:var(--dark);outline:0}
  .praktika-input:focus{border-color:var(--sea)}
  .praktika-show{margin-top:10px;padding:8px 16px;background:0 0;border:1.5px solid var(--light-border);border-radius:8px;font-family:-apple-system,sans-serif;font-size:.8rem;font-weight:500;color:var(--storm);cursor:pointer}
  .praktika-show:hover{border-color:var(--sea);color:var(--sea-dark)}
  .praktika-answer{margin-top:12px;padding:14px 16px;background:var(--sea-light);border-radius:8px}
  .praktika-answer .ans{font-family:Georgia,serif;font-size:1.1rem;color:var(--sea-dark)}
  .praktika-answer .exp{font-size:.8rem;color:var(--mid);margin-top:4px}
  .quiz-header{text-align:center;margin-bottom:28px}
  .quiz-header h3{font-size:1.4rem;color:var(--dark);margin-bottom:6px}
  .quiz-header p{font-size:.88rem;color:var(--storm)}
  .quiz-type-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
  .quiz-type-btn{padding:16px 20px;border-radius:10px;font-family:-apple-system,sans-serif;font-size:.9rem;font-weight:600;cursor:pointer;flex:1;max-width:240px;text-align:center;background:#fff;border:1.5px solid var(--light-border);color:var(--dark);box-shadow:0 2px 0 var(--light-border)}
  .quiz-type-btn:hover{border-color:var(--sea)}
  .quiz-type-btn:active{box-shadow:none;transform:translateY(2px)}
  .quiz-type-btn .qt-icon{font-size:1.4rem;margin-bottom:6px}
  .quiz-type-btn .qt-label{font-size:.82rem;color:var(--mid);font-weight:400}
  .quiz-progress{height:4px;background:var(--light-border);border-radius:2px;margin-bottom:24px;overflow:hidden}
  .quiz-progress-bar{height:100%;background:var(--sea);border-radius:2px;transition:width .3s ease}
  .quiz-question{background:#fff;border:1px solid var(--light-border);border-radius:10px;padding:28px 24px;text-align:center}
  .quiz-prompt-label{font-size:.78rem;color:var(--storm);margin-bottom:8px;text-transform:uppercase;letter-spacing:.04em}
  .quiz-prompt{font-family:Georgia,serif;font-size:1.4rem;color:var(--dark);margin-bottom:24px;line-height:1.3}
  .quiz-mode-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .quiz-mode-btn{padding:14px 24px;border-radius:8px;font-family:-apple-system,sans-serif;font-size:.88rem;font-weight:500;cursor:pointer;flex:1;max-width:220px}
  .quiz-mode-btn.test{background:var(--sea);color:#fff;border:1.5px solid var(--sea);box-shadow:0 3px 0 var(--sea-dark)}
  .quiz-mode-btn.test:active{box-shadow:none;transform:translateY(2px)}
  .quiz-mode-btn.reveal{background:#fff;color:var(--dark);border:1.5px solid var(--light-border);box-shadow:0 3px 0 var(--light-border)}
  .quiz-mode-btn.reveal:active{box-shadow:none;transform:translateY(2px)}
  .quiz-options{display:flex;flex-direction:column;gap:10px}
  .quiz-opt{padding:14px 18px;border:1.5px solid var(--light-border);border-radius:8px;background:#fff;cursor:pointer;font-family:-apple-system,sans-serif;font-size:.9rem;color:var(--dark);text-align:left}
  .quiz-opt:hover:not(.locked){border-color:var(--sea);background:var(--sea-light)}
  .quiz-opt.correct{border-color:var(--sea);background:var(--sea-light);color:var(--sea-dark);font-weight:600}
  .quiz-opt.wrong{border-color:var(--coral);background:var(--coral-light);color:var(--coral)}
  .quiz-opt.locked{cursor:default}.quiz-opt.dim{opacity:.45}
  .quiz-reveal-answer{padding:18px 24px;background:var(--sea-light);border:1.5px solid var(--sea);border-radius:8px;text-align:center}
  .quiz-reveal-answer .ans-label{font-size:.76rem;color:var(--storm);margin-bottom:6px}
  .quiz-reveal-answer .ans-text{font-family:Georgia,serif;font-size:1.3rem;color:var(--sea-dark)}
  .quiz-next{display:block;margin:20px auto 0;padding:12px 32px;background:var(--sea);color:#fff;border:none;border-radius:8px;font-family:-apple-system,sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;box-shadow:0 3px 0 var(--sea-dark)}
  .quiz-next:active{box-shadow:none;transform:translateY(2px)}
  .quiz-result{text-align:center;padding:40px 20px}
  .quiz-result .score{font-family:Georgia,serif;font-size:3rem;color:var(--dark)}
  .quiz-result .msg{font-size:1rem;color:var(--storm);margin:8px 0 28px}
  .restart-btn{padding:12px 28px;background:var(--sea);color:#fff;border:none;border-radius:8px;font-family:-apple-system,sans-serif;font-size:.9rem;font-weight:500;cursor:pointer;margin:0 6px;box-shadow:0 3px 0 var(--sea-dark)}
  .restart-btn:active{box-shadow:none;transform:translateY(2px)}
  .restart-btn.outline{background:#fff;border:1.5px solid var(--light-border);color:var(--storm);box-shadow:0 3px 0 var(--light-border)}
  .combined-quiz-btn{padding:14px 32px;background:var(--sea);color:#fff;border:none;border-radius:10px;font-family:-apple-system,sans-serif;font-size:.95rem;font-weight:600;cursor:pointer;box-shadow:0 3px 0 var(--sea-dark)}
  .combined-quiz-btn:active{box-shadow:none;transform:translateY(2px)}
  .section-label{font-size:.78rem;font-weight:600;color:var(--storm);letter-spacing:.03em;margin-bottom:14px}
  @media(max-width:500px){.landing h1{font-size:2rem}.song-cards{flex-direction:column;align-items:center}.song-card{width:100%}.vocab-grid{grid-template-columns:1fr}}
</style>
</head>

<div class="container" id="app"></div>

const SONGS={

let h=`<p class="section-label">Hitz gakoak \u2014 Toca para ver</p><button class="reveal-all-btn" data-action="reveal-all-vocab">${allR?'Ocultar':'Mostrar todas'}</button>`;
levels.forEach(lv=>{const ws=s.vocab.map((v,i)=>({...v,idx:i})).filter(v=>v.level===lv.n);if(!ws.length)return;
h+=`<div class="level-header"><span class="level-badge ${lv.cls}">${lv.n}</span><span class="level-text">${lv.label}</span></div><div class="vocab-grid">${ws.map(v=>{const r=state.revealedVocab.has(state.song+'-'+v.idx);const ar=state.revealedAnt.has(state.song+'-a-'+v.idx);const mr=state.revealedMorph.has(state.song+'-m-'+v.idx);const antHtml=v.ant?(ar?`<div class="vocab-ant-reveal"><div class="ant-word-big">${v.eu} \u2194 ${v.ant}</div><div class="ant-es">${v.es} \u2194 ${v.antEs}</div></div>`:`<button class="vocab-ant-btn" data-show-ant="${v.idx}">Aurkakoa erakutsi \u2194</button>`):'';const morphHtml=v.morph?(mr?`<div class="vocab-morph-reveal"><div class="morph-main"><span class="morph-root">${v.morph}</span> = ${v.morphEs}</div></div>`:`<button class="vocab-morph-btn" data-show-morph="${v.idx}">Nondik dator? \ud83d\udd0d</button>`):'';return`<div class="vocab-card" data-vocab="${v.idx}"><div class="eu">${v.eu}</div>${r?`<div class="es">${v.es}</div>${v.note?`<div class="note">${v.note}</div>`:''}`:''}${morphHtml}${antHtml}${!r&&!v.ant&&!v.morph?`<div class="flip-hint">\u2193</div>`:!r&&(v.ant||v.morph)?`<div class="flip-hint" style="margin-top:6px">traducci\u00f3n \u2193</div>`:''}</div>`;}).join('')}</div>`;});return h;}

function renderLetra(s){return`<p class="section-label">Letra osoa \u2014 Canci\u00f3n completa con traducci\u00f3n</p>
<div style="background:#fff;border:1px solid var(--light-border);border-radius:10px;padding:28px 24px;font-family:Georgia,serif;font-size:1.05rem;line-height:2.2;color:var(--dark)">
${s.phrases.map(p=>`<span style="background:#fef08a;padding:1px 4px;border-radius:3px">${p.eu.replace(/\n/g,'<br>')}</span> <span style="color:#2563eb;font-size:.85rem">(${p.es.replace(/\n/g,' / ')})</span><br>`).join('<br>')}
</div>`;}

function renderPhrases(s){const allR=s.phrases.every((_,i)=>state.revealedPhrases.has(state.song+'-'+i));
return`<p class="section-label">Esaldiak \u2014 Toca para ver</p><button class="reveal-all-btn" data-action="reveal-all-phrases">${allR?'Ocultar':'Mostrar todas'}</button>
${s.phrases.map((p,i)=>{const k=state.song+'-'+i;const rev=state.revealedPhrases.has(k);const gO=state.openGrammar.has(k);const hk=!!p.known;
return`<div class="phrase-block ${hk?'has-known':''}" data-flip="${i}"><div class="phrase-eu">${p.eu.replace(/\n/g,'<br>')}</div>
${rev?`<div class="phrase-es">${p.es.replace(/\n/g,'<br>')}</div>${p.note?`<div class="phrase-note">${p.note}</div>`:''}${hk?`<span class="known-tag">Ezaguna: ${p.known}</span>`:''}${p.grammar?`<button class="grammar-toggle" data-grammar="${i}">${gO?'\u25be':'\u25b8'} ${p.grammar.label}</button>${gO?`<div class="grammar-box">${p.grammar.rows.map(r=>`<span class="label">${r[0]}</span> \u2192 <span class="conj">${r[1]}</span> \u2014 ${r[2]}<br>`).join('')}</div>`:''}`:''}`:`<div class="flip-hint">\u2193</div>`}</div>`;}).join('')}`;}

function renderPraktika(s){return`<p class="section-label">Praktika \u2014 Transforma las frases</p><p style="font-size:.88rem;color:var(--mid);margin-bottom:20px">Escribe tu respuesta y despu\u00e9s comprueba.</p>
${s.praktika.map((p,i)=>{const rv=state.revealedPraktika.has(state.song+'-p-'+i);
return`<div class="praktika-block"><div class="praktika-original">${p.eu}</div><div class="praktika-trans">${p.es}</div><div class="praktika-challenge">${p.challenge}</div>
<input class="praktika-input" type="text" placeholder="Idatzi hemen..." data-praktika="${i}">
<button class="praktika-show" data-show-praktika="${i}">${rv?'Ezkutatu':'Erantzuna ikusi'}</button>
${rv?`<div class="praktika-answer"><div class="ans">${p.answer}</div><div class="exp">${p.explanation}</div></div>`:''}</div>`;}).join('')}`;}

function genWordQuiz(s){const qs=[];const v=s.vocab;
[...v].sort(()=>Math.random()-.5).slice(0,5).forEach(w=>{const wr=v.filter(x=>x.eu!==w.eu).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.es);qs.push({prompt:w.eu,promptLabel:'Zer esan nahi du?',answer:w.es,options:shuffle([w.es,...wr])});});
[...v].sort(()=>Math.random()-.5).slice(0,5).forEach(w=>{const wr=v.filter(x=>x.eu!==w.eu).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.eu);qs.push({prompt:w.es,promptLabel:'Nola esaten da euskaraz?',answer:w.eu,options:shuffle([w.eu,...wr])});});
const kw=(KNOWN[state.song]||[]);kw.sort(()=>Math.random()-.5).slice(0,2).forEach(w=>{const wr=v.sort(()=>Math.random()-.5).slice(0,3).map(x=>x.es);qs.push({prompt:w.eu,promptLabel:'Gogoratzen duzu?',answer:w.es,options:shuffle([w.es,...wr])});});
ANTONIMOAK.sort(()=>Math.random()-.5).slice(0,2).forEach(a=>{const wr=ANTONIMOAK.filter(x=>x.ant!==a.ant).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.ant);qs.push({prompt:a.eu+' \u2194 ?',promptLabel:'Zein da aurkakoa?',answer:a.ant,options:shuffle([a.ant,...wr])});});
return shuffle(qs).slice(0,12);}
function genPhraseQuiz(s){const qs=[];const sp=s.phrases.filter(p=>p.es.length<65);
sp.sort(()=>Math.random()-.5).slice(0,5).forEach(p=>{const wr=sp.filter(x=>x.es!==p.es).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.es);qs.push({prompt:p.eu.replace(/\n/g,' / '),promptLabel:'Itzuli gaztelaniara',answer:p.es,options:shuffle([p.es,...wr])});});
const s2=s.phrases.filter(p=>p.eu.length<50&&!p.eu.includes('\n'));
s2.sort(()=>Math.random()-.5).slice(0,5).forEach(p=>{const wr=s2.filter(x=>x.eu!==p.eu).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.eu);qs.push({prompt:p.es,promptLabel:'Nola esaten da euskaraz?',answer:p.eu,options:shuffle([p.eu,...wr])});});
return shuffle(qs).slice(0,10);}
function genCombinedQuiz(){const allV=[...SONGS.zapalduen.vocab,...SONGS.ilargia.vocab];const qs=[];
[...allV].sort(()=>Math.random()-.5).slice(0,6).forEach(v=>{const w=allV.filter(x=>x.eu!==v.eu).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.es);qs.push({prompt:v.eu,promptLabel:'Zer esan nahi du?',answer:v.es,options:shuffle([v.es,...w])});});
[...allV].sort(()=>Math.random()-.5).slice(0,6).forEach(v=>{const w=allV.filter(x=>x.eu!==v.eu).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.eu);qs.push({prompt:v.es,promptLabel:'Nola esaten da euskaraz?',answer:v.eu,options:shuffle([v.eu,...w])});});
ANTONIMOAK.sort(()=>Math.random()-.5).slice(0,2).forEach(a=>{const wr=ANTONIMOAK.filter(x=>x.ant!==a.ant).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.ant);qs.push({prompt:a.eu+' \u2194 ?',promptLabel:'Aurkakoa?',answer:a.ant,options:shuffle([a.ant,...wr])});});
return shuffle(qs).slice(0,16);}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function renderQuizBody(q){if(state.quizMode===null)return`<div class="quiz-mode-btns"><button class="quiz-mode-btn test" data-qmode="test">Aukerak erakutsi</button><button class="quiz-mode-btn reveal" data-qmode="reveal">Erantzuna ikusi</button></div>`;
if(state.quizMode==='test')return`<div class="quiz-options">${q.options.map((o,i)=>{let c='quiz-opt';if(state.quizAnswered){c+=' locked';if(o===q.answer)c+=' correct';else if(o===state.quizSelected&&o!==q.answer)c+=' wrong';else c+=' dim';}return`<button class="${c}" data-answer="${i}">${o}</button>`;}).join('')}</div>${state.quizAnswered?`<button class="quiz-next" data-action="next-q">Hurrengoa \u2192</button>`:''}`;
return`<div class="quiz-reveal-answer"><div class="ans-label">Erantzuna</div><div class="ans-text">${q.answer}</div></div><button class="quiz-next" data-action="next-q">Hurrengoa \u2192</button>`;}
function renderQuizResult(ba){const p=state.quizTotal>0?Math.round((state.quizScore/state.quizTotal)*100):0;const m=state.quizTotal===0?'Erantzun guztiak ikusi dituzu.':p>=80?'Bikain!':p>=50?'Ondo!':'Saiatu berriro!';const sk=state.quizQuestions.length-state.quizTotal;
return`<div class="quiz-result"><div class="score">${state.quizTotal>0?state.quizScore+' / '+state.quizTotal:'\u2014'}</div><div class="msg">${m}${sk>0?'<br><span style="font-size:.82rem;color:var(--storm)">'+sk+' erantzuna ikusi</span>':''}</div>
<button class="restart-btn" data-action="${ba}">Berriro</button> <button class="restart-btn outline" data-action="quiz-menu">Atzera</button></div>`;}
function renderQuiz(s){if(!state.quizType)return`<div class="quiz-header"><h3>Azterketa</h3><p>Zer praktikatu nahi duzu?</p></div><div class="quiz-type-btns">
<div class="quiz-type-btn" data-quiztype="words"><div class="qt-icon">Aa</div>Hitzen azterketa<div class="qt-label">Vocabulario + ant\u00f3nimos</div></div>
<div class="quiz-type-btn" data-quiztype="phrases"><div class="qt-icon">\u201c\u201d</div>Esaldien azterketa<div class="qt-label">Frases eu\u2194es</div></div></div>`;
if(state.quizDone)return renderQuizResult(state.quizType==='words'?'restart-words':'restart-phrases');
if(!state.quizQuestions.length){state.quizQuestions=state.quizType==='words'?genWordQuiz(s):genPhraseQuiz(s);state.quizIndex=0;state.quizScore=0;state.quizTotal=0;state.quizAnswered=false;state.quizMode=null;}
const q=state.quizQuestions[state.quizIndex];const pr=(state.quizIndex/state.quizQuestions.length)*100;
return`<div class="quiz-header"><h3>${state.quizType==='words'?'Hitzak':'Esaldiak'}</h3><p>${state.quizIndex+1} / ${state.quizQuestions.length}</p></div>
<div class="quiz-progress"><div class="quiz-progress-bar" style="width:${pr}%"></div></div><div class="quiz-question"><div class="quiz-prompt-label">${q.promptLabel}</div><div class="quiz-prompt">${q.prompt}</div>${renderQuizBody(q)}</div>`;}
function renderCombinedQuiz(){if(state.quizDone)return`<div class="top-bar"><button class="back-btn" data-action="back">\u2190</button><h2>Azterketa orokorra</h2></div>`+renderQuizResult('restart-combined');
if(!state.quizQuestions.length){state.quizQuestions=genCombinedQuiz();state.quizIndex=0;state.quizScore=0;state.quizTotal=0;state.quizAnswered=false;state.quizMode=null;}
const q=state.quizQuestions[state.quizIndex];const pr=(state.quizIndex/state.quizQuestions.length)*100;
return`<div class="top-bar"><button class="back-btn" data-action="back">\u2190</button><h2>Azterketa orokorra</h2></div>
<div class="quiz-header"><p>${state.quizIndex+1} / ${state.quizQuestions.length}</p></div><div class="quiz-progress"><div class="quiz-progress-bar" style="width:${pr}%"></div></div>
<div class="quiz-question"><div class="quiz-prompt-label">${q.promptLabel}</div><div class="quiz-prompt">${q.prompt}</div>${renderQuizBody(q)}</div>`;}

function bindEvents(){
document.querySelectorAll('.song-card').forEach(el=>el.addEventListener('click',()=>{
    if(el.dataset.song==='gernika'){state.view='gernika';render();return;}
    state.view='song';state.song=el.dataset.song;state.tab='sarrera';state.openGrammar.clear();state.revealedPhrases.clear();state.revealedVocab.clear();state.revealedPraktika.clear();state.revealedAnt.clear();state.revealedMorph.clear();resetQuiz();render();}));
document.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>{state.tab=el.dataset.tab;if(el.dataset.tab==='azterketa'){resetQuiz();state.quizType=null;}render();}));
document.querySelectorAll('[data-action="back"]').forEach(el=>el.addEventListener('click',()=>{state.view='landing';state.song=null;render();}));
document.querySelectorAll('.vocab-card[data-vocab]').forEach(el=>el.addEventListener('click',()=>{const k=state.song+'-'+el.dataset.vocab;state.revealedVocab.has(k)?state.revealedVocab.delete(k):state.revealedVocab.add(k);render();}));
document.querySelectorAll('[data-action="reveal-all-vocab"]').forEach(el=>el.addEventListener('click',()=>{const s=SONGS[state.song];const all=s.vocab.every((_,i)=>state.revealedVocab.has(state.song+'-'+i));s.vocab.forEach((_,i)=>{const k=state.song+'-'+i;all?state.revealedVocab.delete(k):state.revealedVocab.add(k);});render();}));
document.querySelectorAll('.phrase-block[data-flip]').forEach(el=>el.addEventListener('click',(e)=>{if(e.target.closest('.grammar-toggle')||e.target.closest('.grammar-box'))return;const k=state.song+'-'+el.dataset.flip;state.revealedPhrases.has(k)?state.revealedPhrases.delete(k):state.revealedPhrases.add(k);render();}));
document.querySelectorAll('[data-action="reveal-all-phrases"]').forEach(el=>el.addEventListener('click',()=>{const s=SONGS[state.song];const all=s.phrases.every((_,i)=>state.revealedPhrases.has(state.song+'-'+i));s.phrases.forEach((_,i)=>{const k=state.song+'-'+i;all?state.revealedPhrases.delete(k):state.revealedPhrases.add(k);});render();}));
document.querySelectorAll('.grammar-toggle').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const k=state.song+'-'+el.dataset.grammar;state.openGrammar.has(k)?state.openGrammar.delete(k):state.openGrammar.add(k);render();}));
document.querySelectorAll('[data-show-praktika]').forEach(el=>el.addEventListener('click',()=>{const k=state.song+'-p-'+el.dataset.showPraktika;state.revealedPraktika.has(k)?state.revealedPraktika.delete(k):state.revealedPraktika.add(k);const inp={};document.querySelectorAll('.praktika-input').forEach(i=>{inp[i.dataset.praktika]=i.value;});render();document.querySelectorAll('.praktika-input').forEach(i=>{if(inp[i.dataset.praktika])i.value=inp[i.dataset.praktika];});}));
document.querySelectorAll('[data-show-ant]').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const k=state.song+'-a-'+el.dataset.showAnt;state.revealedAnt.has(k)?state.revealedAnt.delete(k):state.revealedAnt.add(k);render();}));
document.querySelectorAll('.vocab-ant-reveal').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const card=el.closest('.vocab-card');if(card){const k=state.song+'-a-'+card.dataset.vocab;state.revealedAnt.delete(k);render();}}));
document.querySelectorAll('[data-show-morph]').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const k=state.song+'-m-'+el.dataset.showMorph;state.revealedMorph.has(k)?state.revealedMorph.delete(k):state.revealedMorph.add(k);render();}));
document.querySelectorAll('.vocab-morph-reveal').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const card=el.closest('.vocab-card');if(card){const k=state.song+'-m-'+card.dataset.vocab;state.revealedMorph.delete(k);render();}}));
document.querySelectorAll('[data-quiztype]').forEach(el=>el.addEventListener('click',()=>{state.quizType=el.dataset.quiztype;resetQuiz();render();}));
document.querySelectorAll('[data-action="quiz-menu"]').forEach(el=>el.addEventListener('click',()=>{state.quizType=null;resetQuiz();render();}));
document.querySelectorAll('[data-qmode]').forEach(el=>el.addEventListener('click',()=>{state.quizMode=el.dataset.qmode;if(state.quizMode==='reveal')state.quizAnswered=true;render();}));
document.querySelectorAll('.quiz-opt:not(.locked)').forEach(el=>el.addEventListener('click',()=>{if(state.quizAnswered)return;const q=state.quizQuestions[state.quizIndex];const sel=q.options[parseInt(el.dataset.answer)];state.quizSelected=sel;state.quizAnswered=true;state.quizTotal++;if(sel===q.answer)state.quizScore++;render();}));
document.querySelectorAll('[data-action="next-q"]').forEach(el=>el.addEventListener('click',()=>{state.quizIndex++;state.quizAnswered=false;state.quizSelected=null;state.quizMode=null;if(state.quizIndex>=state.quizQuestions.length)state.quizDone=true;render();}));
document.querySelectorAll('[data-action="restart-words"]').forEach(el=>el.addEventListener('click',()=>{resetQuiz();state.quizType='words';state.quizQuestions=genWordQuiz(SONGS[state.song]);render();}));
document.querySelectorAll('[data-action="restart-phrases"]').forEach(el=>el.addEventListener('click',()=>{resetQuiz();state.quizType='phrases';state.quizQuestions=genPhraseQuiz(SONGS[state.song]);render();}));
document.querySelectorAll('[data-action="combined-quiz"]').forEach(el=>el.addEventListener('click',()=>{state.view='combined';state.song=null;resetQuiz();render();}));
document.querySelectorAll('[data-action="restart-combined"]').forEach(el=>el.addEventListener('click',()=>{resetQuiz();state.quizQuestions=genCombinedQuiz();render();}));}
function resetQuiz(){state.quizQuestions=[];state.quizIndex=0;state.quizScore=0;state.quizTotal=0;state.quizAnswered=false;state.quizSelected=null;state.quizDone=false;state.quizMode=null;}
render();
</script>
</body>
</html>
