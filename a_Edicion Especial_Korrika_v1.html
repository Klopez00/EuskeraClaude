  .top-bar{display:flex;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid var(--light-border);margin-bottom:24px}.back-btn{background:0 0;border:none;cursor:pointer;font-size:1.4rem;color:var(--storm);padding:4px 8px;border-radius:6px}.back-btn:hover{background:rgba(0,0,0,.05)}.top-bar h2{font-size:1.5rem;color:var(--dark)}

  .vocab-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}.vocab-card{background:#fff;border:1px solid var(--light-border);border-radius:8px;padding:16px 18px;cursor:pointer;transition:all .15s;min-height:72px}.vocab-card:hover{border-color:var(--sea)}.vocab-card .eu{font-family:Georgia,serif;font-size:1.2rem;color:var(--dark)}.vocab-card .flip-hint{font-size:.72rem;color:var(--storm);margin-top:6px;opacity:.6}.vocab-card .es{font-size:.85rem;color:var(--mid);margin-top:6px;padding-top:6px;border-top:1px solid var(--light-border)}.vocab-card .note{font-size:.78rem;color:var(--sea-dark);margin-top:4px;font-style:italic}

  .level-header{display:flex;align-items:center;gap:10px;margin:24px 0 14px}.level-header:first-of-type{margin-top:0}.level-badge{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:.78rem;font-weight:700;color:#fff}.level-badge.l1{background:var(--sea)}.level-badge.l2{background:var(--amber)}.level-badge.l3{background:var(--coral)}.level-text{font-size:.82rem;font-weight:500;color:var(--mid)}

  .section-label{font-size:.78rem;font-weight:600;color:var(--storm);letter-spacing:.03em;margin-bottom:14px}

    {eu:"Big Be\u00f1at, babarrunak eta aza popularra\nSuge tako mexikarra eta pa amb tom\u00e0quet",es:"Big Be\u00f1at, alubias y col popular\ntaco de serpiente mexicano y pan con tomate",note:"Mezcla deliberada de comidas de distintas culturas: alubias vascas, tacos mexicanos, pa amb tom\u00e0quet catal\u00e1n. Ejemplo de intercambio cultural real."},
    {eu:"Gazta eta intxaurrak\nLurra ez baita zolua",es:"Queso y nueces\nporque la Tierra no es un agujero",known:"lurra"},
    {eu:"Bazter dezagun behingoz\nkaka zahar-zaharra",es:"Dejemos de una vez\nla mierda vieja"},
    {eu:"Ttipi ttapa, ttipi ttapa... KORRIKA!",es:"Paso a pasito... \u00a1KORRIKA!",note:"Ttipi ttapa: onomatopeya de pasitos cortos y r\u00e1pidos. Sonido de la carrera."},
  ],
  praktika:[
    {eu:"Eskualdunak gara",es:"(somos vascos)",challenge:"\u00bfSi hablo solo de m\u00ed (ni)?",answer:"Eskualduna naiz",explanation:"gara (gu) \u2192 naiz (ni), eskualdunak \u2192 eskualduna"},
    {eu:"Korrika badator",es:"(viene la Korrika)",challenge:"\u00bfSi vienen todos (haiek)?",answer:"Korrika badatoz",explanation:"badator (hura) \u2192 badatoz (haiek)"},
    {eu:"Mundu bat bildu",es:"(unir un mundo)",challenge:"\u00bfEn pasado? (unimos un mundo)",answer:"Mundu bat bildu genuen",explanation:"a\u00f1adir auxiliar transitivo pasado: genuen (guk)"},
    {eu:"Begira ezazu",es:"(mira)",challenge:"\u00bfSi se lo decimos a varias personas (zuek)?",answer:"Begira ezazue",explanation:"imperativo: ezazu (zuk) \u2192 ezazue (zuek)"},
    {eu:"Lurra ez baita zolua",es:"(porque la Tierra no es un agujero)",challenge:"\u00bfEn afirmativo? (la Tierra es un agujero)",answer:"Lurra zolua baita / Lurra zolua da",explanation:"negaci\u00f3n: ez baita \u2192 afirmativo: baita / da"},

const state={view:'landing',tab:'sarrera',openGrammar:new Set,revealedPhrases:new Set,revealedVocab:new Set,revealedPraktika:new Set,revealedAnt:new Set,revealedMorph:new Set,quizType:null,quizQuestions:[],quizIndex:0,quizScore:0,quizTotal:0,quizAnswered:false,quizDone:false,quizMode:null,quizSelected:null};
function render(){document.getElementById('app').innerHTML=state.view==='landing'?renderLanding():renderSong();bindEvents();}
function renderLanding(){return`<div class="special-banner"><div class="sb-tag">Hamasei Puntu \u2014 Edizio Berezia</div><div class="sb-title">Korrika kantak</div></div>
<div class="landing"><h1>Korrika</h1><p class="sub">Canciones de la carrera por el euskera</p>
<div class="bio">La Korrika es una carrera popular ininterrumpida de 11 d\u00edas que recorre Euskal Herria a favor del euskera. Cada edici\u00f3n tiene su propia canci\u00f3n. En esta edici\u00f3n especial trabajamos solo una para no saturar: la de Ferm\u00edn Muguruza (2021). No est\u00e1 en Spotify \u2014 b\u00fascala en YouTube.</div>
<div class="song-cards"><div class="song-card" data-song="d"><h3>Korrika</h3><p>Ferm\u00edn Muguruza (2021). Globalizaci\u00f3n, identidad, diversidad. Big Be\u00f1at vs Big Mac.</p></div></div>
<p style="font-size:.88rem;color:var(--mid);line-height:1.7;margin-top:24px;max-width:500px;margin-left:auto;margin-right:auto;text-align:left"><span style="color:var(--sea);font-weight:600">Aipamen bereziak:</span> tambi\u00e9n merecen una escucha la canci\u00f3n de la Korrika de Pello Reparaz (2026) y la de Gozategi. Tres generaciones, una misma carrera.</p></div>`;}
function renderSong(){const tabs=[{id:'sarrera',label:'Sarrera'},{id:'ezagunak',label:'Ezagunak'},{id:'hitzak',label:'Hitzak'},{id:'esaldiak',label:'Esaldiak'},{id:'praktika',label:'Praktika'},{id:'azterketa',label:'Azterketa'}];let c='';
if(state.tab==='sarrera')c=`<div class="intro-section"><h3>Ferm\u00edn Muguruza \u2014 ${S.title} (2021)</h3><p>${S.introEs}</p></div>`;
else if(state.tab==='ezagunak')c=renderKnown();else if(state.tab==='hitzak')c=renderVocab();else if(state.tab==='esaldiak')c=renderPhrases();else if(state.tab==='praktika')c=renderPraktika();else if(state.tab==='azterketa')c=renderQuiz();
return`<div class="special-banner"><div class="sb-tag">Edizio Berezia</div><div class="sb-title">Korrika</div></div><div class="top-bar"><button class="back-btn" data-action="back">\u2190</button><h2>${S.title}</h2></div><div class="tabs">${tabs.map(t=>`<button class="tab ${state.tab===t.id?'active':''}" data-tab="${t.id}">${t.label}</button>`).join('')}</div>${c}`;}
function renderKnown(){return`<p class="section-label">Hitz ezagunak \u2014 Palabras que ya viste</p><p style="font-size:.88rem;color:var(--mid);margin-bottom:20px">Palabras de canciones anteriores que aparecen aqu\u00ed.</p>${KW.map(w=>`<div class="known-card"><div class="eu">${w.eu}</div><div class="es">${w.es}</div><div class="known-ctx"><div class="known-ctx-label orig">${w.origSong}</div><div class="known-ctx-phrase">${w.orig}</div><div class="known-ctx-trans">${w.origEs}</div></div><div class="known-arrow">\u2193</div><div class="known-ctx"><div class="known-ctx-label here">Korrika (Ferm00edn Muguruza)</div><div class="known-ctx-phrase">${w.here}</div><div class="known-ctx-trans">${w.hereEs}</div></div></div>`).join('')}`;}
function renderVocab(){const allR=S.vocab.every((_,i)=>state.revealedVocab.has('v-'+i));const lvs=[{n:1,label:'Oinarrizkoa',cls:'l1'},{n:2,label:'Ertaina',cls:'l2'},{n:3,label:'Aurreratua',cls:'l3'}];
let h=`<p class="section-label">Hitz gakoak</p><button class="reveal-all-btn" data-action="reveal-all-vocab">${allR?'Ezkutatu':'Erakutsi denak'}</button>`;
lvs.forEach(lv=>{const ws=S.vocab.map((v,i)=>({...v,idx:i})).filter(v=>v.level===lv.n);if(!ws.length)return;
h+=`<div class="level-header"><span class="level-badge ${lv.cls}">${lv.n}</span><span class="level-text">${lv.label}</span></div><div class="vocab-grid">${ws.map(v=>{const r=state.revealedVocab.has('v-'+v.idx);const mr=state.revealedMorph.has('m-'+v.idx);const ar=state.revealedAnt.has('a-'+v.idx);const mH=v.morph?(mr?`<div class="vocab-morph-reveal"><div class="morph-main"><span class="morph-root">${v.morph}</span> = ${v.morphEs}</div></div>`:`<button class="vocab-morph-btn" data-show-morph="${v.idx}">Nondik dator? \ud83d\udd0d</button>`):'';const aH=v.ant?(ar?`<div class="vocab-ant-reveal"><div class="ant-word-big">${v.eu} \u2194 ${v.ant}</div><div class="ant-es">${v.es} \u2194 ${v.antEs}</div></div>`:`<button class="vocab-ant-btn" data-show-ant="${v.idx}">Aurkakoa \u2194</button>`):'';return`<div class="vocab-card" data-vocab="${v.idx}"><div class="eu">${v.eu}</div>${r?`<div class="es">${v.es}</div>${v.note?`<div class="note">${v.note}</div>`:''}`:''}${mH}${aH}${!r&&!v.ant&&!v.morph?`<div class="flip-hint">\u2193</div>`:!r&&(v.ant||v.morph)?`<div class="flip-hint" style="margin-top:6px">itzulpena \u2193</div>`:''}</div>`;}).join('')}</div>`;});return h;}
function renderPhrases(){const allR=S.phrases.every((_,i)=>state.revealedPhrases.has('p-'+i));
return`<p class="section-label">Esaldiak</p><button class="reveal-all-btn" data-action="reveal-all-phrases">${allR?'Ezkutatu':'Erakutsi denak'}</button>${S.phrases.map((p,i)=>{const rev=state.revealedPhrases.has('p-'+i);const gO=state.openGrammar.has('g-'+i);const hk=!!p.known;return`<div class="phrase-block ${hk?'has-known':''}" data-flip="${i}"><div class="phrase-eu">${p.eu.replace(/\n/g,'<br>')}</div>${rev?`<div class="phrase-es">${p.es.replace(/\n/g,'<br>')}</div>${p.note?`<div class="phrase-note">${p.note}</div>`:''}${hk?`<span class="known-tag">Ezaguna: ${p.known}</span>`:''}${p.grammar?`<button class="grammar-toggle" data-grammar="${i}">${gO?'\u25be':'\u25b8'} ${p.grammar.label}</button>${gO?`<div class="grammar-box">${p.grammar.rows.map(r=>`<span class="label">${r[0]}</span> \u2192 <span class="conj">${r[1]}</span> \u2014 ${r[2]}<br>`).join('')}</div>`:''}`:''}`:`<div class="flip-hint">\u2193</div>`}</div>`;}).join('')}`;}
function renderPraktika(){return`<p class="section-label">Praktika</p><p style="font-size:.88rem;color:var(--mid);margin-bottom:20px">Idatzi zure erantzuna eta gero egiaztatu.</p>${S.praktika.map((p,i)=>{const rv=state.revealedPraktika.has('pr-'+i);return`<div class="praktika-block"><div class="praktika-original">${p.eu}</div><div class="praktika-trans">${p.es}</div><div class="praktika-challenge">${p.challenge}</div><input class="praktika-input" type="text" placeholder="Idatzi hemen..." data-praktika="${i}"><button class="praktika-show" data-show-praktika="${i}">${rv?'Ezkutatu':'Erantzuna ikusi'}</button>${rv?`<div class="praktika-answer"><div class="ans">${p.answer}</div><div class="exp">${p.explanation}</div></div>`:''}</div>`;}).join('')}`;}
function gWQ(){const qs=[];const v=S.vocab;[...v].sort(()=>Math.random()-.5).slice(0,5).forEach(w=>{const wr=v.filter(x=>x.eu!==w.eu).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.es);qs.push({prompt:w.eu,promptLabel:'Zer esan nahi du?',answer:w.es,options:shuffle([w.es,...wr])});});[...v].sort(()=>Math.random()-.5).slice(0,5).forEach(w=>{const wr=v.filter(x=>x.eu!==w.eu).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.eu);qs.push({prompt:w.es,promptLabel:'Nola esaten da euskaraz?',answer:w.eu,options:shuffle([w.eu,...wr])});});KW.forEach(w=>{const wr=v.sort(()=>Math.random()-.5).slice(0,3).map(x=>x.es);qs.push({prompt:w.eu,promptLabel:'Gogoratzen duzu?',answer:w.es,options:shuffle([w.es,...wr])});});return shuffle(qs).slice(0,12);}
function gPQ(){const qs=[];const sp=S.phrases.filter(p=>p.es.length<65);sp.sort(()=>Math.random()-.5).slice(0,5).forEach(p=>{const wr=sp.filter(x=>x.es!==p.es).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.es);qs.push({prompt:p.eu.replace(/\n/g,' / '),promptLabel:'Itzuli',answer:p.es,options:shuffle([p.es,...wr])});});const s2=S.phrases.filter(p=>!p.eu.includes('\n')&&p.eu.length<50);s2.sort(()=>Math.random()-.5).slice(0,5).forEach(p=>{const wr=s2.filter(x=>x.eu!==p.eu).sort(()=>Math.random()-.5).slice(0,3).map(x=>x.eu);qs.push({prompt:p.es,promptLabel:'Euskaraz?',answer:p.eu,options:shuffle([p.eu,...wr])});});return shuffle(qs).slice(0,10);}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function rQB(q){if(state.quizMode===null)return`<div class="quiz-mode-btns"><button class="quiz-mode-btn test" data-qmode="test">Aukerak</button><button class="quiz-mode-btn reveal" data-qmode="reveal">Erantzuna</button></div>`;if(state.quizMode==='test')return`<div class="quiz-options">${q.options.map((o,i)=>{let c='quiz-opt';if(state.quizAnswered){c+=' locked';if(o===q.answer)c+=' correct';else if(o===state.quizSelected&&o!==q.answer)c+=' wrong';else c+=' dim';}return`<button class="${c}" data-answer="${i}">${o}</button>`;}).join('')}</div>${state.quizAnswered?`<button class="quiz-next" data-action="next-q">Hurrengoa \u2192</button>`:''}`;return`<div class="quiz-reveal-answer"><div class="ans-label">Erantzuna</div><div class="ans-text">${q.answer}</div></div><button class="quiz-next" data-action="next-q">Hurrengoa \u2192</button>`;}
function renderQuiz(){if(!state.quizType)return`<div class="quiz-header"><h3>Azterketa</h3><p>Zer praktikatu?</p></div><div class="quiz-type-btns"><div class="quiz-type-btn" data-quiztype="words"><div class="qt-icon">Aa</div>Hitzak<div class="qt-label">Vocabulario</div></div><div class="quiz-type-btn" data-quiztype="phrases"><div class="qt-icon">\u201c\u201d</div>Esaldiak<div class="qt-label">Frases</div></div></div>`;
if(state.quizDone){const p=state.quizTotal>0?Math.round((state.quizScore/state.quizTotal)*100):0;const m=state.quizTotal===0?'Denak ikusi dituzu.':p>=80?'Bikain!':p>=50?'Ondo!':'Saiatu berriro!';const sk=state.quizQuestions.length-state.quizTotal;return`<div class="quiz-result"><div class="score">${state.quizTotal>0?state.quizScore+' / '+state.quizTotal:'\u2014'}</div><div class="msg">${m}${sk>0?'<br><span style="font-size:.82rem;color:var(--storm)">'+sk+' ikusi</span>':''}</div><button class="restart-btn" data-action="restart-quiz">Berriro</button> <button class="restart-btn outline" data-action="quiz-menu">Atzera</button></div>`;}
if(!state.quizQuestions.length){state.quizQuestions=state.quizType==='words'?gWQ():gPQ();state.quizIndex=0;state.quizScore=0;state.quizTotal=0;state.quizAnswered=false;state.quizMode=null;}const q=state.quizQuestions[state.quizIndex];const pr=(state.quizIndex/state.quizQuestions.length)*100;
return`<div class="quiz-header"><h3>${state.quizType==='words'?'Hitzak':'Esaldiak'}</h3><p>${state.quizIndex+1} / ${state.quizQuestions.length}</p></div><div class="quiz-progress"><div class="quiz-progress-bar" style="width:${pr}%"></div></div><div class="quiz-question"><div class="quiz-prompt-label">${q.promptLabel}</div><div class="quiz-prompt">${q.prompt}</div>${rQB(q)}</div>`;}
function bindEvents(){
document.querySelectorAll('.song-card').forEach(el=>el.addEventListener('click',()=>{state.view='song';state.tab='sarrera';state.openGrammar.clear();state.revealedPhrases.clear();state.revealedVocab.clear();state.revealedPraktika.clear();state.revealedAnt.clear();state.revealedMorph.clear();resetQuiz();render();}));
document.querySelectorAll('.tab').forEach(el=>el.addEventListener('click',()=>{state.tab=el.dataset.tab;if(el.dataset.tab==='azterketa'){resetQuiz();state.quizType=null;}render();}));
document.querySelectorAll('[data-action="back"]').forEach(el=>el.addEventListener('click',()=>{state.view='landing';render();}));
document.querySelectorAll('.vocab-card[data-vocab]').forEach(el=>el.addEventListener('click',()=>{const k='v-'+el.dataset.vocab;state.revealedVocab.has(k)?state.revealedVocab.delete(k):state.revealedVocab.add(k);render();}));
document.querySelectorAll('[data-action="reveal-all-vocab"]').forEach(el=>el.addEventListener('click',()=>{const all=S.vocab.every((_,i)=>state.revealedVocab.has('v-'+i));S.vocab.forEach((_,i)=>{const k='v-'+i;all?state.revealedVocab.delete(k):state.revealedVocab.add(k);});render();}));
document.querySelectorAll('.phrase-block[data-flip]').forEach(el=>el.addEventListener('click',(e)=>{if(e.target.closest('.grammar-toggle')||e.target.closest('.grammar-box'))return;const k='p-'+el.dataset.flip;state.revealedPhrases.has(k)?state.revealedPhrases.delete(k):state.revealedPhrases.add(k);render();}));
document.querySelectorAll('[data-action="reveal-all-phrases"]').forEach(el=>el.addEventListener('click',()=>{const all=S.phrases.every((_,i)=>state.revealedPhrases.has('p-'+i));S.phrases.forEach((_,i)=>{const k='p-'+i;all?state.revealedPhrases.delete(k):state.revealedPhrases.add(k);});render();}));
document.querySelectorAll('.grammar-toggle').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const k='g-'+el.dataset.grammar;state.openGrammar.has(k)?state.openGrammar.delete(k):state.openGrammar.add(k);render();}));
document.querySelectorAll('[data-show-praktika]').forEach(el=>el.addEventListener('click',()=>{const k='pr-'+el.dataset.showPraktika;state.revealedPraktika.has(k)?state.revealedPraktika.delete(k):state.revealedPraktika.add(k);const inp={};document.querySelectorAll('.praktika-input').forEach(i=>{inp[i.dataset.praktika]=i.value;});render();document.querySelectorAll('.praktika-input').forEach(i=>{if(inp[i.dataset.praktika])i.value=inp[i.dataset.praktika];});}));
document.querySelectorAll('[data-show-morph]').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const k='m-'+el.dataset.showMorph;state.revealedMorph.has(k)?state.revealedMorph.delete(k):state.revealedMorph.add(k);render();}));
document.querySelectorAll('.vocab-morph-reveal').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const card=el.closest('.vocab-card');if(card){state.revealedMorph.delete('m-'+card.dataset.vocab);render();}}));
document.querySelectorAll('[data-show-ant]').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const k='a-'+el.dataset.showAnt;state.revealedAnt.has(k)?state.revealedAnt.delete(k):state.revealedAnt.add(k);render();}));
document.querySelectorAll('.vocab-ant-reveal').forEach(el=>el.addEventListener('click',(e)=>{e.stopPropagation();const card=el.closest('.vocab-card');if(card){state.revealedAnt.delete('a-'+card.dataset.vocab);render();}}));
document.querySelectorAll('[data-quiztype]').forEach(el=>el.addEventListener('click',()=>{state.quizType=el.dataset.quiztype;resetQuiz();render();}));
document.querySelectorAll('[data-action="quiz-menu"]').forEach(el=>el.addEventListener('click',()=>{state.quizType=null;resetQuiz();render();}));
document.querySelectorAll('[data-qmode]').forEach(el=>el.addEventListener('click',()=>{state.quizMode=el.dataset.qmode;if(state.quizMode==='reveal')state.quizAnswered=true;render();}));
document.querySelectorAll('.quiz-opt:not(.locked)').forEach(el=>el.addEventListener('click',()=>{if(state.quizAnswered)return;const q=state.quizQuestions[state.quizIndex];const sel=q.options[parseInt(el.dataset.answer)];state.quizSelected=sel;state.quizAnswered=true;state.quizTotal++;if(sel===q.answer)state.quizScore++;render();}));
document.querySelectorAll('[data-action="next-q"]').forEach(el=>el.addEventListener('click',()=>{state.quizIndex++;state.quizAnswered=false;state.quizSelected=null;state.quizMode=null;if(state.quizIndex>=state.quizQuestions.length)state.quizDone=true;render();}));
document.querySelectorAll('[data-action="restart-quiz"]').forEach(el=>el.addEventListener('click',()=>{const t=state.quizType;resetQuiz();state.quizType=t;state.quizQuestions=t==='words'?gWQ():gPQ();render();}));}
function resetQuiz(){state.quizQuestions=[];state.quizIndex=0;state.quizScore=0;state.quizTotal=0;state.quizAnswered=false;state.quizSelected=null;state.quizDone=false;state.quizMode=null;}
render();
</script>
</body>
</html>
